spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql=true/
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql=trace

server.servlet.contextPath=/rjp
#actuator configuration
management.security.enabled=false
security.basic.enabled=false
management.endpoints.web.exposure.include=*


Db.connections=\
  {DB1:"${DB1_JDBC_URL}",\
  DB2:"${DB2_JDBC_URL}",\
  DB3:"${DB3_JDBC_URL}"}

json.folder.path=src/main/resources/access_descriptor

app.datasource.maximum-pool-size=10
app.async.max-threads-per-db=10
app.async.max-threads-total=100
app.async.queue-capacity=100
app.batch.max-threads-per-request=10

# Enable CORS
cors.allowCredentials=true

# Allowed origins
cors.allowedOrigins=http://localhost:4200

# Allowed methods
cors.allowedMethods=GET,POST,PUT,DELETE

# Allowed headers
cors.allowedHeaders=*

# Exposed headers
cors.exposedHeaders=Authorization,Link

# Max age
cors.maxAge=3600
